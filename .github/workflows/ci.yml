name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Format check
        run: |
          if ! npm run format:check; then
            echo "::error title=Formatting::Prettier would apply the diff below"
            npx prettier --write 'packages/**/src/**/*.{ts,tsx,json}' > /dev/null
            git --no-pager diff
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: npm run tsc

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.invalid"

      - name: Run unit tests
        run: npm test -- --ci --reporters=default

  integration-tests:
    name: Integration Tests (OPA + Regal)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: npm run tsc

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.invalid"

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Install Regal
        run: |
          curl -L -o /usr/local/bin/regal https://github.com/StyraInc/regal/releases/latest/download/regal_Linux_x86_64
          chmod +x /usr/local/bin/regal

      - name: Run integration tests
        run: npm test -- --testPathPattern=integration --ci
        env:
          OPA_BINARY_PATH: opa
          REGAL_BINARY_PATH: regal

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: npm run tsc

      - name: Configure Git for tests
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.invalid"

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Run E2E tests
        run: npm test -- --testPathPattern=e2e --ci
        env:
          OPA_BINARY_PATH: opa
          OPA_SERVER_URL: http://localhost:8181
