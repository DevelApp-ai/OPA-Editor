name: Debug UI Tests

# TEMPORARY debug workflow — surfaces Jest failure output as check-run
# annotations (readable via the public API) and applies canonical prettier
# formatting. Delete once CI is green.

on:
  push:
    branches: [feat/ui-screenshot-testing]

jobs:
  ui-tests:
    name: Run UI tests (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build packages
        run: npm run tsc

      - name: Run UI tests
        run: |
          set +e
          npx jest --ci --testPathPattern=__tests__/ui > /tmp/jest.log 2>&1
          echo "jest_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit failures as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import re

          log = open('/tmp/jest.log', errors='replace').read()
          log = re.sub(r'\x1b\[[0-9;]*m', '', log)

          # Jest failure blocks start with '● ' at column 0.
          parts = re.split(r'(?m)^● ', log)
          blocks = [p.strip() for p in parts[1:]]
          blocks = [b[:450] for b in blocks]

          if not blocks:
              # Fall back to the tail of the log (module errors, config errors…)
              tail = log.strip()[-4500:]
              lines = tail.splitlines()
              chunks = ['\n'.join(lines[i:i + 10]) for i in range(0, len(lines), 10)][:10]
              chunks = [c[:450] for c in chunks]
          else:
              chunks = blocks[:10]
              if len(blocks) > 10:
                  chunks.append('(+%d more failure blocks — see job log)' % (len(blocks) - 10))

          for i, chunk in enumerate(chunks):
              if not chunk.strip():
                  continue
              msg = chunk.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=Jest failure %d/%d::%s' % (i + 1, len(chunks), msg))
          PY

  prettier-fix:
    name: Apply canonical prettier formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-screenshot-testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply prettier
        run: npx prettier --write 'packages/**/src/**/*.{ts,tsx,json}'

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- packages
          if git diff --cached --quiet; then
            echo "Tree is already prettier-clean"
          else
            git commit -m "style: apply prettier formatting"
            git push
          fi
